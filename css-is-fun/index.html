<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>LG CNS</h1>
        <p>Viet Nam Build Center</p>
      </header>

      <section class="grid-container" aria-label="Demo grid">
        <div class="grid-item">
          <!-- HEART CHECKBOX -->
          <input type="checkbox" id="heart">
          <label class="heart-label" for="heart">&#10084</label>
        </div>
        <div class="grid-item">
          <!-- TEXT ANIMATED -->
          <span class="text-animated">I am a</span>
        </div>
        <div class="grid-item flip-card">
          <!-- FLIP CARD -->
          <div class="card-inner">
            <div class="card-front">
              <div class="heading">Flip Card</div>
              <p>HOVER ME</p>
            </div>
            <div class="card-back">
              <div class="heading">Back</div>
              <p>LEAVE ME</p>
            </div>
          </div>
        </div>
        <div class="grid-item">
          <!-- COLOR PALETTE -->
          <div class="color-palette">
            <div class="color-item blue-1">
              <p>#0F2854</p>
            </div>
            <div class="color-item blue-2">
              <p>#1C4D8D</p>
            </div>
            <div class="color-item blue-3">
              <p>#4988C4</p>
            </div>
            <div class="color-item blue-4">
              <p>#BDE8F5</p>
            </div>
          </div>
        </div>
        <div class="grid-item">
          <!-- SIMPLE POPUP -->
          <button class="popup-btn" popovertarget="reward-popup">
            🎁 Claim Reward
          </button>
          <div id="reward-popup" popover>
            <button class="close-btn" popovertarget="reward-popup" popovertargetaction="hide">
              &times;
            </button>
            <h3>🎉 Congratulation</h3>
            <p>💰 You earned <b>100 coins 🪙</b></p>
          </div>
        </div>
        <div class="grid-item">6</div>
        <div class="grid-item">7</div>
        <div class="grid-item">8</div>
        <div class="grid-item">9</div>
        <div class="grid-item">10</div>
        <div class="grid-item">11</div>
        <div class="grid-item">12</div>
        <div class="grid-item">13</div>
        <div class="grid-item">14</div>
        <div class="grid-item">15</div>
        <div class="grid-item">16</div>
        <div class="grid-item">17</div>
        <div class="grid-item">18</div>
        <div class="grid-item">19</div>
        <div class="grid-item">20</div>
        <div class="grid-item">21</div>
        <div class="grid-item">22</div>
        <div class="grid-item">23</div>
        <div class="grid-item">24</div>
        <div class="grid-item">25</div>
        <div class="grid-item">15</div>
        <div class="grid-item">16</div>
        <div class="grid-item">17</div>
        <div class="grid-item">18</div>
        <div class="grid-item">19</div>
        <div class="grid-item">20</div>
        <div class="grid-item">21</div>
        <div class="grid-item">22</div>
        <div class="grid-item">23</div>
        <div class="grid-item">24</div>
        <div class="grid-item">25</div>
      </section>
    </main>
  </body>
</html>
